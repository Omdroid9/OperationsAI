name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Demo mode must work with no provider keys, so the eval runs with none set.
      - run: npm run eval:rag
      - name: Eval report is committed
        run: git diff --exit-code docs/research/eval-latest.md
